name: Build and Release EXE
on:
  push:
    branches: [arena/51bc3a69-game1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npx electron-packager . "Synapsis" --platform=win32 --arch=x64 --out=dist_electron --overwrite --app-version=1.2.0 --executable-name=Synapsis-Chronoresonance-Duel
      - shell: pwsh
        run: Compress-Archive -Path dist_electron/Synapsis-win32-x64/* -DestinationPath Synapsis-Chronoresonance-Windows.zip -Force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "СИНАПСИС: Хронорезонанс v1.2.0 — Standalone"
          body: |
            ## СИНАПСИС: Хронорезонанс v1.2.0 — Standalone (без браузера)
            Отдельное окно 1280×800, без Chrome/адресной строки.

            ### ⬇ Скачать
            **Standalone ZIP (рекомендуется):**
            https://github.com/ritmiro1/Game1/releases/download/v1.2.0/Synapsis-Chronoresonance-Windows.zip
            → скачай → распакуй → запусти Synapsis-Chronoresonance-Duel.exe

            **Легаси-инсталлер:**
            https://github.com/ritmiro1/Game1/releases/download/v1.2.0/Synapsis-Chronoresonance-Duel-Setup.exe
          files: |
            Synapsis-Chronoresonance-Windows.zip
            dist/Synapsis-Chronoresonance-Duel-Setup.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
