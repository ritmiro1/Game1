# Aetheris 1.3 — original cinematic forward/deferred hybrid
oldLighting=false
oldHandLight=false
dynamicHandLight=true
clouds=fancy
sun=false
moon=false
stars=false
vignette=false
underwaterOverlay=false
separateAo=false
shadowTerrain=true
#if COLORED_SHADOWS == 1
shadowTranslucent=true
#else
shadowTranslucent=false
#endif
blend.shadow=off
shadowEntities=true
shadowBlockEntities=true
# Preserve material MRTs for translucent geometry; alpha blend only the HDR color.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
profile.LOW=HIZ_SSR=0 SSGI=0 COLORED_LIGHTS=0 COLORED_SHADOWS=0 CAUSTICS=0 FOAM=0 PUDDLES=0 CLOUD_LAYERS=1 WEATHER_FRONTS=0 EFFECT_RESOLUTION=0 ATMOSPHERE_QUALITY=0 CLOUD_MODE=3 AO_DISTANCE=24.0 SSR_DISTANCE=24.0 PCSS=0 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=1024 SHADOW_SAMPLES=4 AO_SAMPLES=4 REFLECTION_STEPS=0 VOLUMETRIC_STEPS=0 WATER_QUALITY=1 CLOUD_QUALITY=1
profile.MEDIUM=HIZ_SSR=0 SSGI=0 COLORED_LIGHTS=0 COLORED_SHADOWS=0 CAUSTICS=0 FOAM=1 PUDDLES=1 CLOUD_LAYERS=2 WEATHER_FRONTS=0 EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=1 CLOUD_MODE=3 AO_DISTANCE=48.0 SSR_DISTANCE=48.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=8 REFLECTION_STEPS=8 VOLUMETRIC_STEPS=4 WATER_QUALITY=2 CLOUD_QUALITY=1
profile.HIGH=HIZ_SSR=1 SSGI=0 COLORED_LIGHTS=0 COLORED_SHADOWS=1 CAUSTICS=1 FOAM=1 PUDDLES=1 CLOUD_LAYERS=2 WEATHER_FRONTS=0 EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=1 CLOUD_MODE=3 AO_DISTANCE=64.0 SSR_DISTANCE=64.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=16 REFLECTION_STEPS=16 VOLUMETRIC_STEPS=8 WATER_QUALITY=2 CLOUD_QUALITY=2
profile.ULTRA=HIZ_SSR=1 SSGI=1 COLORED_LIGHTS=1 COLORED_SHADOWS=1 CAUSTICS=1 FOAM=1 PUDDLES=1 CLOUD_LAYERS=2 WEATHER_FRONTS=1 GI_SAMPLES=16 EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=2 CLOUD_MODE=2 CLOUD_STEPS=20 AO_DISTANCE=96.0 SSR_DISTANCE=96.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=8 shadowMapResolution=4096 SHADOW_SAMPLES=16 AO_SAMPLES=16 REFLECTION_STEPS=32 VOLUMETRIC_STEPS=16 WATER_QUALITY=3 CLOUD_QUALITY=2
screen=<profile> [MATERIALS] [SHADOWS] [LIGHTING] [INDIRECT] [WATER] [ATMOSPHERE] [POST]
screen.INDIRECT=SSGI GI_STRENGTH GI_SAMPLES GI_TEMPORAL COLORED_LIGHTS COLORED_RADIUS COLORED_STRENGTH
screen.SHADOWS=COLORED_SHADOWS SHADOW_TINT_STRENGTH shadowMapResolution SHADOW_SAMPLES shadowDistance PCSS SHADOW_BLOCKER_SAMPLES SHADOW_SOFTNESS
screen.MATERIALS=LAB_PBR NORMAL_STRENGTH POM POM_STEPS POM_DEPTH POM_DISTANCE
screen.LIGHTING=BLOCK_LIGHT_WARMTH BLOCK_LIGHT_STRENGTH CAVE_BRIGHTNESS AO_DISTANCE AO_SAMPLES AO_STRENGTH AO_RADIUS EMISSIVE_BRIGHTNESS NIGHT_BRIGHTNESS
screen.WATER=CAUSTICS CAUSTIC_STRENGTH FOAM FOAM_STRENGTH PUDDLES PUDDLE_AMOUNT drynessHalflife HIZ_SSR SSR_DISTANCE REFLECTION_STEPS WATER_QUALITY WATER_ABSORPTION WATER_REFRACTION
screen.ATMOSPHERE=RAIN_OPACITY WEATHER_HAZE CLOUD_LAYERS WEATHER_FRONTS FRONT_STRENGTH ATMOSPHERE_QUALITY FOG_DENSITY CLOUD_MODE CLOUD_COVERAGE CLOUD_STEPS VOLUMETRIC_STEPS VOLUMETRIC_STRENGTH CLOUD_QUALITY
screen.POST=MOTION_VECTORS EFFECT_RESOLUTION BLOOM_ENABLED TAA TAA_HISTORY AUTO_EXPOSURE BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION COLOR_GRADE VIGNETTE FXAA DOF DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH
sliders=RAIN_OPACITY WEATHER_HAZE BLOCK_LIGHT_WARMTH BLOCK_LIGHT_STRENGTH CAVE_BRIGHTNESS GI_STRENGTH COLORED_STRENGTH SHADOW_TINT_STRENGTH CAUSTIC_STRENGTH FOAM_STRENGTH PUDDLE_AMOUNT FRONT_STRENGTH FOG_DENSITY CLOUD_COVERAGE NORMAL_STRENGTH POM_DEPTH SHADOW_SOFTNESS WATER_ABSORPTION WATER_REFRACTION TAA_HISTORY NIGHT_BRIGHTNESS AO_STRENGTH AO_RADIUS BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION EMISSIVE_BRIGHTNESS VOLUMETRIC_STRENGTH DOF_STRENGTH MOTION_BLUR_STRENGTH
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
