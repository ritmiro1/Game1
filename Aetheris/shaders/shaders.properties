program.world-1/deferred2.enabled=false
program.world1/deferred2.enabled=false
program.deferred3.enabled=false
program.world-1/deferred3.enabled=false
program.world1/deferred3.enabled=false
program.deferred4.enabled=false
program.world-1/deferred4.enabled=false
program.world1/deferred4.enabled=false
#endif
#if SSGI == 0
#if COLORED_LIGHTS == 0
program.deferred5.enabled=false
program.world-1/deferred5.enabled=false
program.world1/deferred5.enabled=false
program.deferred6.enabled=false
program.world-1/deferred6.enabled=false
program.world1/deferred6.enabled=false
program.deferred7.enabled=false
program.world-1/deferred7.enabled=false
program.world1/deferred7.enabled=false
#endif
#endif
#if GI_TEMPORAL == 0
program.deferred6.enabled=false
program.world-1/deferred6.enabled=false
program.world1/deferred6.enabled=false
#endif
program.world-1/shadow.enabled=false
program.world-1/composite1.enabled=false
program.world-1/composite2.enabled=false
program.world1/shadow.enabled=false
program.world1/composite1.enabled=false
program.world1/composite2.enabled=false
