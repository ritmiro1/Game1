# Aetheris 1.2 — original cinematic forward/deferred hybrid
oldLighting=false
oldHandLight=false
dynamicHandLight=true
clouds=fancy
sun=false
moon=false
stars=false
vignette=false
underwaterOverlay=false
separateAo=false
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
# Preserve material MRTs for translucent geometry; alpha blend only the HDR color.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
profile.LOW=EFFECT_RESOLUTION=0 ATMOSPHERE_QUALITY=0 CLOUD_MODE=1 AO_DISTANCE=24.0 SSR_DISTANCE=24.0 PCSS=0 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=1024 SHADOW_SAMPLES=4 AO_SAMPLES=4 REFLECTION_STEPS=0 VOLUMETRIC_STEPS=0 WATER_QUALITY=1 CLOUD_QUALITY=1
profile.MEDIUM=EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=1 CLOUD_MODE=1 AO_DISTANCE=48.0 SSR_DISTANCE=48.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=8 REFLECTION_STEPS=8 VOLUMETRIC_STEPS=4 WATER_QUALITY=2 CLOUD_QUALITY=1
profile.HIGH=EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=1 CLOUD_MODE=1 AO_DISTANCE=64.0 SSR_DISTANCE=64.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=16 REFLECTION_STEPS=16 VOLUMETRIC_STEPS=8 WATER_QUALITY=2 CLOUD_QUALITY=2
profile.ULTRA=EFFECT_RESOLUTION=1 ATMOSPHERE_QUALITY=2 CLOUD_MODE=2 CLOUD_STEPS=20 AO_DISTANCE=96.0 SSR_DISTANCE=96.0 PCSS=1 SHADOW_BLOCKER_SAMPLES=8 shadowMapResolution=4096 SHADOW_SAMPLES=16 AO_SAMPLES=16 REFLECTION_STEPS=32 VOLUMETRIC_STEPS=16 WATER_QUALITY=3 CLOUD_QUALITY=2
screen=<profile> [MATERIALS] [SHADOWS] [LIGHTING] [WATER] [ATMOSPHERE] [POST]
screen.SHADOWS=shadowMapResolution SHADOW_SAMPLES shadowDistance PCSS SHADOW_BLOCKER_SAMPLES SHADOW_SOFTNESS
screen.MATERIALS=LAB_PBR NORMAL_STRENGTH POM POM_STEPS POM_DEPTH POM_DISTANCE
screen.LIGHTING=AO_DISTANCE AO_SAMPLES AO_STRENGTH AO_RADIUS EMISSIVE_BRIGHTNESS NIGHT_BRIGHTNESS
screen.WATER=SSR_DISTANCE REFLECTION_STEPS WATER_QUALITY WATER_ABSORPTION WATER_REFRACTION
screen.ATMOSPHERE=ATMOSPHERE_QUALITY FOG_DENSITY CLOUD_MODE CLOUD_COVERAGE CLOUD_STEPS VOLUMETRIC_STEPS VOLUMETRIC_STRENGTH CLOUD_QUALITY
screen.POST=EFFECT_RESOLUTION BLOOM_ENABLED TAA TAA_HISTORY AUTO_EXPOSURE BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION COLOR_GRADE VIGNETTE FXAA DOF DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH
sliders=FOG_DENSITY CLOUD_COVERAGE NORMAL_STRENGTH POM_DEPTH SHADOW_SOFTNESS WATER_ABSORPTION WATER_REFRACTION TAA_HISTORY NIGHT_BRIGHTNESS AO_STRENGTH AO_RADIUS BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION EMISSIVE_BRIGHTNESS VOLUMETRIC_STRENGTH DOF_STRENGTH MOTION_BLUR_STRENGTH
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
# Avoid running a full-resolution resolve/history write when temporal AA is off.
#if TAA == 0
program.composite3.enabled=false
#endif
#if BLOOM_ENABLED == 0
program.composite4.enabled=false
program.composite5.enabled=false
#endif
# Both bloom targets use the same dimensions; each pass only draws to one target.
#if EFFECT_RESOLUTION == 0
size.buffer.colortex4=0.25 0.25
size.buffer.colortex5=0.25 0.25
#elif EFFECT_RESOLUTION == 1
size.buffer.colortex4=0.5 0.5
size.buffer.colortex5=0.5 0.5
#else
size.buffer.colortex4=1.0 1.0
size.buffer.colortex5=1.0 1.0
#endif
#if CLOUD_MODE == 1
clouds=fancy
#else
clouds=off
#endif

#if CLOUD_MODE != 2
program.composite1.enabled=false
program.composite2.enabled=false
#endif
blend.gbuffers_terrain.colortex7=off
blend.gbuffers_entities.colortex7=off
blend.gbuffers_block.colortex7=off
blend.gbuffers_hand.colortex7=off
blend.gbuffers_hand_water.colortex7=off
blend.gbuffers_textured.colortex7=off
blend.gbuffers_textured_lit.colortex7=off
blend.gbuffers_water.colortex7=off
blend.gbuffers_weather.colortex7=off

#if CLOUD_QUALITY == 0
program.composite1.enabled=false
program.composite2.enabled=false
clouds=off
#endif
