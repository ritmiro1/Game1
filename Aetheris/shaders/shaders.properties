# Aetheris 1.1 — original cinematic forward/deferred hybrid
oldLighting=false
oldHandLight=false
dynamicHandLight=true
clouds=fancy
sun=false
moon=false
stars=false
vignette=false
underwaterOverlay=false
separateAo=false
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowBlockEntities=true
# Preserve material MRTs for translucent geometry; alpha blend only the HDR color.
blend.gbuffers_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_weather.colortex2=off
profile.LOW=PCSS=0 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=1024 SHADOW_SAMPLES=4 AO_SAMPLES=4 REFLECTION_STEPS=0 VOLUMETRIC_STEPS=0 WATER_QUALITY=1 CLOUD_QUALITY=1
profile.MEDIUM=PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=8 REFLECTION_STEPS=8 VOLUMETRIC_STEPS=4 WATER_QUALITY=2 CLOUD_QUALITY=1
profile.HIGH=PCSS=1 SHADOW_BLOCKER_SAMPLES=4 shadowMapResolution=2048 SHADOW_SAMPLES=8 AO_SAMPLES=16 REFLECTION_STEPS=16 VOLUMETRIC_STEPS=8 WATER_QUALITY=2 CLOUD_QUALITY=2
profile.ULTRA=PCSS=1 SHADOW_BLOCKER_SAMPLES=8 shadowMapResolution=4096 SHADOW_SAMPLES=16 AO_SAMPLES=16 REFLECTION_STEPS=32 VOLUMETRIC_STEPS=16 WATER_QUALITY=3 CLOUD_QUALITY=2
screen=<profile> [SHADOWS] [LIGHTING] [WATER] [ATMOSPHERE] [POST]
screen.SHADOWS=shadowMapResolution SHADOW_SAMPLES shadowDistance PCSS SHADOW_BLOCKER_SAMPLES SHADOW_SOFTNESS
screen.LIGHTING=AO_SAMPLES AO_STRENGTH AO_RADIUS EMISSIVE_BRIGHTNESS NIGHT_BRIGHTNESS
screen.WATER=REFLECTION_STEPS WATER_QUALITY WATER_ABSORPTION WATER_REFRACTION
screen.ATMOSPHERE=VOLUMETRIC_STEPS VOLUMETRIC_STRENGTH CLOUD_QUALITY
screen.POST=TAA TAA_HISTORY AUTO_EXPOSURE BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION COLOR_GRADE VIGNETTE FXAA DOF DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH
sliders=SHADOW_SOFTNESS WATER_ABSORPTION WATER_REFRACTION TAA_HISTORY NIGHT_BRIGHTNESS AO_STRENGTH AO_RADIUS BLOOM_STRENGTH BLOOM_THRESHOLD EXPOSURE SATURATION EMISSIVE_BRIGHTNESS VOLUMETRIC_STRENGTH DOF_STRENGTH MOTION_BLUR_STRENGTH
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
