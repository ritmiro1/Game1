blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
# Avoid running a full-resolution resolve/history write when temporal AA is off.
#if TAA == 0
program.composite3.enabled=false
program.world-1/composite3.enabled=false
program.world1/composite3.enabled=false
#endif
#if BLOOM_ENABLED == 0
program.composite4.enabled=false
program.world-1/composite4.enabled=false
program.world1/composite4.enabled=false
program.composite5.enabled=false
program.world-1/composite5.enabled=false
program.world1/composite5.enabled=false
#endif
# Both bloom targets use the same dimensions; each pass only draws to one target.
#if EFFECT_RESOLUTION == 0
size.buffer.colortex4=0.25 0.25
size.buffer.colortex5=0.25 0.25
#elif EFFECT_RESOLUTION == 1
size.buffer.colortex4=0.5 0.5
size.buffer.colortex5=0.5 0.5
#else
size.buffer.colortex4=1.0 1.0
size.buffer.colortex5=1.0 1.0
#endif
#if CLOUD_MODE == 1
clouds=fancy
#else
clouds=off
#endif

#if CLOUD_MODE != 2
program.composite1.enabled=false
program.world-1/composite1.enabled=false
program.world1/composite1.enabled=false
program.composite2.enabled=false
program.world-1/composite2.enabled=false
program.world1/composite2.enabled=false
#endif
blend.gbuffers_terrain.colortex7=off
blend.gbuffers_entities.colortex7=off
blend.gbuffers_block.colortex7=off
blend.gbuffers_hand.colortex7=off
blend.gbuffers_hand_water.colortex7=off
blend.gbuffers_textured.colortex7=off
blend.gbuffers_textured_lit.colortex7=off
blend.gbuffers_water.colortex7=off
blend.gbuffers_weather.colortex7=off

#if CLOUD_QUALITY == 0
program.composite1.enabled=false
program.world-1/composite1.enabled=false
program.world1/composite1.enabled=false
program.composite2.enabled=false
program.world-1/composite2.enabled=false
program.world1/composite2.enabled=false
clouds=off
#endif
size.buffer.colortex9=0.5 0.5
size.buffer.colortex10=0.25 0.25
size.buffer.colortex11=0.125 0.125
size.buffer.colortex12=0.0625 0.0625
size.buffer.colortex13=0.5 0.5
size.buffer.colortex14=0.5 0.5
#if HIZ_SSR == 0
program.deferred1.enabled=false
program.world-1/deferred1.enabled=false
program.world1/deferred1.enabled=false
